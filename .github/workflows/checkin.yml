name: WorkBuddy 签到值守（一天一轮）

on:
  schedule:
    - cron: "*/10 1-15 * * *"   # 北京时间 09:00–23:50，每 10 分钟一轮
  workflow_dispatch:            # 随时手动触发

concurrency:
  group: wb-checkin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 恢复长效令牌与当日进度
        uses: actions/cache@v4
        with:
          path: ~/.workbuddy/store
          key: wb-store-${{ github.run_id }}
          restore-keys: |
            wb-store-

      - name: 载入令牌与进度（缓存缺失时用 Secret 兜底）
        shell: bash
        run: |
          mkdir -p ~/.workbuddy
          if [ -s ~/.workbuddy/store/checkin-rt.json ]; then
            cp ~/.workbuddy/store/checkin-rt.json ~/.workbuddy/checkin-rt.json
            echo "令牌已从缓存恢复"
          fi
          if [ -s ~/.workbuddy/store/state.json ]; then
            cp ~/.workbuddy/store/state.json ~/.workbuddy/state.json
            echo "当日进度已从缓存恢复"
          fi
          if [ ! -s ~/.workbuddy/checkin-rt.json ]; then
            printf '%s' "$WB_RT" > ~/.workbuddy/checkin-rt.json
            echo "令牌已从 Secret 初始化"
          fi
        env:
          WB_RT: ${{ secrets.WB_RT }}

      - name: 执行当天任务（一天一轮）
        shell: bash
        run: python3 scripts/once_a_day.py

      - name: 回存轮换后的令牌与当日进度
        if: always()
        shell: bash
        run: |
          mkdir -p ~/.workbuddy/store
          if [ -s ~/.workbuddy/checkin-rt.json ]; then
            cp ~/.workbuddy/checkin-rt.json ~/.workbuddy/store/checkin-rt.json
          fi
          if [ -s ~/.workbuddy/state.json ]; then
            cp ~/.workbuddy/state.json ~/.workbuddy/store/state.json
          fi
          echo "已回存，供下一轮使用"

      - name: 保活提交（防止仓库 60 天无活动导致定时任务被停用）
        if: always() && github.event_name == 'schedule'
        shell: bash
        run: |
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          mkdir -p .keepalive
          prev=$(cat .keepalive/last-run.txt 2>/dev/null || echo "1970-01-01")
          days=$(( ( $(date -d "$today" +%s) - $(date -d "$prev" +%s) ) / 86400 ))
          if [ "$days" -ge 7 ]; then
            echo "$today" > .keepalive/last-run.txt
            git config user.name "wb-keeper"
            git config user.email "wb-keeper@users.noreply.github.com"
            git add .keepalive/last-run.txt
            git commit -m "chore: keepalive $today"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "已写入保活提交"
          else
            echo "距上次保活仅 ${days} 天，跳过"
          fi
